<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c41-bg-f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19191d"/>
      <stop offset="55%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>
    <linearGradient id="c41-gold-f" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0%" stop-color="#ffd97d"/>
      <stop offset="48%" stop-color="#f5a524"/>
      <stop offset="100%" stop-color="#d95b16"/>
    </linearGradient>
    <linearGradient id="c41-glass-f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#d8d4ce" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#9e9890" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="c41-coat-f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="c41-glow-f" cx="0.48" cy="0.46" r="0.52">
      <stop offset="0%" stop-color="#f5a524" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#f5a524" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <g transform="translate(256 256) scale(0.96) translate(-256 -256)">
    <circle cx="256" cy="256" r="224" fill="url(#c41-glow-f)"/>
    <!-- Precision subtle outer optical barrel track -->
    <circle cx="256" cy="256" r="192" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/>
    <!-- Primary luminous C-aperture arc -->
    <path d="M403.08 379.42 A192 192 0 1 1 403.08 132.58" fill="none" stroke="url(#c41-gold-f)" stroke-width="42" stroke-linecap="round"/>
    <!-- Inner coated optical lens ring -->
    <path d="M328.89 356.32 A124 124 0 1 1 328.89 155.68" fill="none" stroke="url(#c41-glass-f)" stroke-width="16" stroke-linecap="round"/>
    <!-- Anti-reflective cyan lens coating highlight -->
    <path d="M144.55 201.64 A124 124 0 0 1 221.82 136.8" fill="none" stroke="url(#c41-coat-f)" stroke-width="12" stroke-linecap="round"/>
    <!-- Precision optical center aperture & right-side shutter alignment dot -->
    <circle cx="256" cy="256" r="34" fill="url(#c41-gold-f)"/>
    <circle cx="256" cy="256" r="14" fill="#09090b"/>
    <circle cx="388" cy="256" r="18" fill="#f8f8fa"/>
    
    <!-- Fine Leica-style lens calibration ticks -->
    <g stroke="rgba(255,255,255,0.22)" stroke-width="5" stroke-linecap="round">
      <line x1="256" y1="16" x2="256" y2="34"/>
      <line x1="256" y1="478" x2="256" y2="496"/>
      <line x1="16" y1="256" x2="34" y2="256"/>
    </g>
  </g></svg>
